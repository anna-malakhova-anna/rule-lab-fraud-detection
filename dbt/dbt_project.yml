name: smb_fraud_rule_lab
version: "0.1.0"
config-version: 2
profile: smb_fraud_rule_lab

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  smb_fraud_rule_lab:
    staging:
      +materialized: view
      +schema: staging
    features:
      +materialized: table
      +schema: features
    rules:
      +materialized: table
      +schema: rules
    monitoring:
      +materialized: table
      +schema: monitoring
    vendors:
      +materialized: table
      +schema: vendors
    cases:
      +materialized: table
      +schema: cases
    backtest:
      +materialized: table
      +schema: backtest

seeds:
  smb_fraud_rule_lab:
    +schema: config
    cfg_window:
      +column_types: {window_start: date, train_end: date, window_end: date, instant_launch_date: date}
    cfg_rules:
      +column_types: {reason_code: varchar, owner: varchar, threshold: double, tune: boolean, effective_from_alarm: varchar, escalate_action: varchar, escalate_at: double}
    cfg_rule_params:
      +column_types: {value: double}
    cfg_sweep:
      +column_types: {cutoff: double}
    cfg_costs:
      +column_types: {value: double}
    cfg_ops:
      +column_types: {value: double}
    cfg_vendors:
      +column_types: {cost_per_call: double, latency_ms: double, coverage: double}
    cfg_decline_bar:
      +column_types: {decline_at: double}
    cfg_governance:
      +column_types: {value: double}
    cfg_rule_changes:
      +column_types: {change_date: date, threshold: double, action: varchar}
    cfg_fast_lane_caps:
      +column_types: {max_amount: double}
    cfg_review_lag:
      +column_types: {lag_quarters: integer}
