[project]
name = "smb-fraud-rule-lab"
version = "0.1.0"
description = "Fraud rules for a SYNTHETIC small-business bank: generator with an answer key, SQL rules in dbt on DuckDB, and a backtest harness."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.5.6,<2",          # 2.0.0 has an intermittent internal join error on our feature models (ADR-017)
    "dbt-core",
    "dbt-duckdb",
    "faker",
    "numpy",
    "pyarrow",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["generator", "generator.typologies", "loader", "scripts", "scripts.sitegen", "scripts.sitegen.pages"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["F", "E9", "I"]   # undefined names, unused imports/variables, syntax errors, import order
