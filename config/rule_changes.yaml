# Change log: every rule added and every threshold, action or scope change, with the evidence behind it
# (module F, ADR-024). Newest last. tests/test_governance.py checks that each rule's latest entry matches its
# threshold and action in config/rules.yaml, so a change that skips this log fails the build.
#
# date      the day the change was made in this project
# change    added | threshold | action | scope | status
# threshold / action   the values AFTER the change (omit when unchanged)
# decision  the ADR that records the choice
# backtest  the result that justified it, by model or document

