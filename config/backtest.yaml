# How the backtest turns rule hits into fraud caught, good customers hurt and ops load.
# All values are assumptions for a synthetic bank (ADR-003, ADR-004, ADR-008).

# Severity orders actions when several rules hit the same transaction: the strongest wins.
# prevents: share of the case's later loss stopped when this action lands on real fraud (ADR-003).
# hold_days: how long a good customer's money waits when this action lands on them. An RFI asks for
#   documents without stopping the payment, so it holds nothing.
# delay: a launch control sends an instant payout the standard way instead (ADR-021). It stops nothing by itself;
#   it gives the other rules their review window back. Automatic, so no analyst review; the customer waits a day.
actions:
  allow: {severity: 0, prevents: 0.0, hold_days: 0, review: false}
  rfi:   {severity: 1, prevents: 0.5, hold_days: 0, review: true}
  delay: {severity: 2, prevents: 0.0, hold_days: 1, review: false}
  hold:  {severity: 3, prevents: 1.0, hold_days: 2, review: true}
  block: {severity: 4, prevents: 1.0, hold_days: 5, review: true}

# Review capacity sized to the book (ADR-004): reviews land on the next business day.
capacity:
  analysts: 2.25                 # 1.5 analysts per 8,000 businesses, scaled to the 12,000-business book
  reviews_per_analyst_day: 40

# Costs used ONLY to pick challenger thresholds on the training months (ADR-008). Invented, stated, and
# shown next to every result so a reader can disagree with them.
costs:
  review_cost: 30                    # analyst time per review, USD
  good_customer_touch_cost: 150      # friction, support contact and churn risk when a good business is flagged
  hold_cost_per_dollar_day: 0.0005   # 5 bps per day of a good customer's money held
  payroll_delay_cost: 1000           # a delayed payroll is the worst thing we can do to a good business
  good_applicant_decline_cost: 300   # a good business turned away at onboarding: lost lifetime value (ADR-012)
  # A single rule may use at most this share of daily review capacity on average (training months).
  max_capacity_share_per_rule: 0.5

# Weekly monitoring and alarms (ADR-014). Alarms read only data the bank has (returns, alerts), no labels.
monitoring:
  baseline_weeks: 12               # a series is compared with its own trailing 12 weeks
  sigma: 3                         # alarm when this week is more than 3 standard deviations above that
  min_count: 3                     # and at least this many events (a floor of 1 is used for the deviation)
  investigation_business_days: 10  # from first alarm to a new rule in production
  precision_maturity_days: 30      # monitoring precision counts labels known within 30 days of the week

# Risk Ops (module A, ADR-019): alerts become cases, worked by analysts at the capacity above.
ops:
  # How long a case can wait before its action lapses: an unreviewed hold auto-releases, an RFI goes stale.
  review_window_business_days: {hold: 2, rfi: 5, block: 2}
  # A case reviewed at day d is decided at this hour (one shift). Customer wait is measured to this time.
  decision_hour: 13
  # Exposure for alerts that are not payments: an application is worth its stated monthly revenue;
  # a credit decision is worth the line's current limit.
  application_exposure_months_of_revenue: 1.0
  # Analyst decisions become labels (the feedback loop), with error.
  analyst_miss_rate: 0.10          # fraud cases an analyst clears by mistake
  analyst_false_flag_rate: 0.02    # good cases an analyst marks as fraud
  seed: 42

# Rollout plan for a proposed rule (module B engineering ticket, ADR-020).
rollout:
  shadow_business_days: 10        # the rule logs what it would have done, without acting
  kill_switch_multiple: 3         # turn the rule off if its daily cases exceed this multiple of the backtest's expectation

bootstrap:
  iterations: 1000
  seed: 42
